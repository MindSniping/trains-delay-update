name: rl-live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: rl-live
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python live_rl.py
      - name: Publish rl_live.json on the "data" branch (single commit, force-pushed)
        run: |
          mkdir out && cp rl_live.json out/
          cd out
          git init -q -b data
          git config user.name "rl-live"
          git config user.email "rl-live@users.noreply.github.com"
          git add rl_live.json
          git commit -q -m "rl live"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
